<svg xmlns="http://www.w3.org/2000/svg" width="840" height="300" viewBox="0 0 840 300" role="img" aria-label="Moisés Santos de Oliveira, desenvolvedor full stack. Sir Pet e SirBarber em produção, Shardspire em acesso antecipado na Google Play, SirTech Manager open source.">
<style>
text{font:14px ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
.nm{font:700 19px ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
.l{opacity:0;animation:in .35s ease-out forwards}
@keyframes in{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
.dot{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.cur{opacity:0;animation:blink 1.1s steps(1) 3.90s infinite}
@keyframes blink{0%{opacity:1}50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.l{animation:none;opacity:1}.dot,.cur{animation:none}}
</style>
