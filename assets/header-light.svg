<svg xmlns="http://www.w3.org/2000/svg" width="840" height="300" viewBox="0 0 840 300" role="img" aria-label="Moisés Santos de Oliveira, desenvolvedor full stack. Sir Pet e SirBarber em produção, Shardspire em acesso antecipado na Google Play, SirTech Manager open source.">
<style>
